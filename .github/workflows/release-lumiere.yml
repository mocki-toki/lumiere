name: Release Lumiere

on:
  push:
    branches:
      - main-lumiere
  workflow_dispatch:

concurrency:
  group: release-lumiere-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.rel.outputs.should_release }}

    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: origin/main

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch branches and tags
        run: |
          set -euo pipefail
          git fetch --no-tags origin main main-lumiere
          git fetch --tags origin

      - name: Compute Lumiere release
        id: rel
        run: node scripts/release-lumiere.mjs

      - name: Stop when no releasable fork commits found
        if: steps.rel.outputs.should_release != 'true'
        run: |
          echo "No releasable fork commits detected. Skipping release."

      - name: Commit version update
        if: steps.rel.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/branding/version.ts
          git commit -m "chore(release): lumiere v${{ steps.rel.outputs.lumiere_version }} [skip ci]"

      - name: Push release commit
        if: steps.rel.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main-lumiere

      - name: Create tag
        if: steps.rel.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git tag "${{ steps.rel.outputs.tag_name }}"
          git push origin "${{ steps.rel.outputs.tag_name }}"

      - name: Publish GitHub release
        if: steps.rel.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          gh release create "${{ steps.rel.outputs.tag_name }}" \
            --title "Lumiere ${{ steps.rel.outputs.lumiere_version }}" \
            --notes-file "${{ steps.rel.outputs.release_notes_file }}"

  deploy-pages:
    needs: release
    if: needs.release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout released branch tip
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main-lumiere
          fetch-depth: 1

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build

      - name: Inject CNAME
        run: |
          set -euo pipefail
          printf 'lumiere.mktk.cc\n' > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745 # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d7f561429d3a7e17f84cc5b28794b171d0a88c50 # v4.0.5
