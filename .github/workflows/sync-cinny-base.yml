name: Sync Cinny Base

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_CINNY_PAT }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_CINNY_PAT }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and origin
        run: |
          set -euo pipefail
          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream https://github.com/cinnyapp/cinny.git
          fi

          git fetch upstream dev
          git fetch origin main dev-lumiere

      - name: Fast-forward main to upstream/dev
        run: |
          set -euo pipefail

          MAIN_SHA="$(git rev-parse origin/main)"
          UPSTREAM_SHA="$(git rev-parse upstream/dev)"

          if [ "$MAIN_SHA" != "$UPSTREAM_SHA" ]; then
            git checkout main
            git merge --ff-only upstream/dev
            git push origin main
          fi

      - name: Ensure sync label exists
        run: |
          set -euo pipefail
          gh label create cinny-base-sync --color 1f6feb --description "Automated Cinny base sync PR" || true

      - name: Create or update sync PR
        run: |
          set -euo pipefail

          git fetch origin main dev-lumiere
          AHEAD_COUNT="$(git rev-list --count origin/dev-lumiere..origin/main)"
          if [ "$AHEAD_COUNT" -eq 0 ]; then
            echo "No new base commits to propose into dev-lumiere."
            exit 0
          fi

          EXISTING="$(gh pr list --base dev-lumiere --head main --state open --json number --jq '.[0].number')"
          TITLE="chore(sync): update Cinny base from upstream/dev"
          BODY_FILE="$(mktemp)"

          printf '%s\n' \
            'This PR was created automatically by the **Sync Cinny Base** workflow.' \
            '' \
            '- Base mirror branch `main` was fast-forwarded to `upstream/dev`.' \
            '- Please merge this PR into `dev-lumiere` after conflict resolution and checks.' \
            '- Keep `main-lumiere` release-only; upstream base changes should flow through `dev-lumiere`.' \
            > "$BODY_FILE"

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE" --add-label cinny-base-sync
          else
            gh pr create --base dev-lumiere --head main --title "$TITLE" --body-file "$BODY_FILE" --label cinny-base-sync
          fi
